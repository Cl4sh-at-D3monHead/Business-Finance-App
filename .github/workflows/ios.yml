name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test on iPhone Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-Generate Shared Schemes
        run: |
          # Forces Xcode to look at the project and generate missing shared schemes
          xcodebuild -list -project Ledger.xcodeproj

      - name: Build and Test on Simulator
        run: |
          xcodebuild test \
            -project Ledger.xcodeproj \
            -scheme "Ledger" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest"
