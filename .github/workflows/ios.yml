name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test on iPhone Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Expose and Share Xcode Schemes
        run: |
          ruby -e "
          require 'xcodeproj'
          project_path = 'Ledger.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          project.recreate_user_schemes
          project.save
          target_name = project.targets.first.name
          File.open(ENV['GITHUB_ENV'], 'a') { |f| f.puts \"DETECTED_SCHEME=\#{target_name}\" }
          puts \"Successfully uncovered scheme: \#{target_name}\"
          "

      - name: Build and Test on Simulator
        run: |
          xcodebuild test \
            -project Ledger.xcodeproj \
            -scheme "${{ env.DETECTED_SCHEME }}" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""
