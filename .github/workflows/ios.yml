name: Build macOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compile Native Mac App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recreate Schemes
        run: |
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Ledger.xcodeproj')
          project.recreate_user_schemes
          project.save
          "

      - name: Build macOS App Binary
        run: |
          xcodebuild archive \
            -project Ledger.xcodeproj \
            -scheme "Ledger" \
            -configuration Release \
            -archivePath ./build/Ledger.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload Mac App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-Mac-App
          path: ./build/Ledger.xcarchive/Products/Applications/
